# enable zmk studio for realtime keymap updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Report the right half's battery level too (left half = central). The
# left half fetches it and exposes it as a second Battery Level service
# ("Peripheral 0"). Central-only options: the right half build ignores them.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Deep sleep after 15 minutes without input to save battery. Both halves
# wake on a key press (the kscan is a wakeup-source); that first key is
# used to wake and is not sent.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Full consumer usage range: the calculator key (AL Calculator, 0x192) is
# above the basic 0x00-0xFF range.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
